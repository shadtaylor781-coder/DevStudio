<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevStudio</title>
  <!-- SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: space-between;
      align-items: center;
    }
    header, footer {
      width: 100%;
      max-width: 800px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      color: #38bdf8;
      font-size: 24px;
    }
    .container {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 2px solid #334155;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .tab-btn.active {
      color: #38bdf8;
      border-bottom: 2px solid #38bdf8;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #cbd5e1;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    button.submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button.submit-btn:hover {
      background-color: #0369a1;
    }
    .hidden { display: none; }
    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
    }
    .success { background-color: #065f46; color: #34d399; }
    .error { background-color: #991b1b; color: #f87171; }
  </style>
</head>
<body>

  <header>
    <h1>DevStudio</h1>
    <div id="nav-auth-status" style="font-size: 14px; color: #94a3b8;"></div>
  </header>

  <main style="display: flex; flex-direction: column; align-items: center; padding: 20px; width: 100%;">
    <div style="text-align: center; margin-bottom: 30px;">
      <h2 style="font-size: 32px; margin-bottom: 10px;">Mes Futures Applications</h2>
      <p style="color: #94a3b8; max-width: 500px;">Bienvenue sur DevStudio. Connectez-vous ou créez un compte pour accéder à vos espaces.</p>
    </div>

    <div class="container">
      <!-- Session active -->
      <div id="session-box" class="hidden">
        <p>Vous êtes connecté en tant que :</p>
        <p id="user-email-display" style="color: #38bdf8; font-weight: bold; margin: 10px 0;"></p>
        <button onclick="handleLogout()" class="submit-btn" style="background-color: #ef4444;">Se déconnecter</button>
      </div>

      <!-- Formulaire -->
      <div id="auth-box">
        <div class="tabs">
          <button id="tab-login" onclick="switchTab('login')" class="tab-btn active">Connexion</button>
          <button id="tab-signup" onclick="switchTab('signup')" class="tab-btn">Inscription</button>
        </div>

        <form onsubmit="handleAuthSubmit(event)">
          <div class="form-group">
            <label>Adresse e-mail</label>
            <input type="email" id="email" required placeholder="votre@email.com">
          </div>

          <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="password" required placeholder="••••••••">
          </div>

          <button type="submit" id="submit-btn" class="submit-btn">Se connecter</button>
        </form>

        <div id="form-message" class="message hidden"></div>
      </div>
    </div>
  </main>

  <footer>
    <p style="color: #64748b; font-size: 13px; margin: auto;">&copy; 2026 DevStudio - Tous droits réservés.</p>
  </footer>

  <script>
    const SUPABASE_URL = "https://kjkvsoimkvgocdgildjh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_qoUk0BL2Ee28rdMnQ8bapQ_81WXBw7q"; // Remplacez par votre clé Supabase

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentMode = 'login';

    function switchTab(mode) {
      currentMode = mode;
      document.getElementById('tab-login').className = mode === 'login' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('tab-signup').className = mode === 'signup' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('submit-btn').textContent = mode === 'login' ? 'Se connecter' : "S'inscrire";
      hideMessage();
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      hideMessage();

      if (currentMode === 'signup') {
        const { error } = await supabase.auth.signUp({ email, password });
        if (error) showMessage(error.message, 'error');
        else showMessage("Compte créé avec succès ! Vérifiez vos e-mails.", 'success');
      } else {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) showMessage("Identifiants incorrects.", 'error');
        else {
          showMessage("Connexion réussie !", 'success');
          checkUserSession();
        }
      }
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      checkUserSession();
      showMessage("Déconnecté.", 'success');
    }

    async function checkUserSession() {
      const { data: { user } } = await supabase.auth.getUser();
      if (user) {
        document.getElementById('auth-box').classList.add('hidden');
        document.getElementById('session-box').classList.remove('hidden');
        document.getElementById('user-email-display').textContent = user.email;
        document.getElementById('nav-auth-status').textContent = `Connecté (${user.email})`;
      } else {
        document.getElementById('auth-box').classList.remove('hidden');
        document.getElementById('session-box').classList.add('hidden');
        document.getElementById('nav-auth-status').textContent = '';
      }
    }

    function showMessage(text, type) {
      const box = document.getElementById('form-message');
      box.textContent = text;
      box.className = `message ${type}`;
    }
    function hideMessage() {
      const box = document.getElementById('form-message');
      box.className = 'message hidden';
    }

    checkUserSession();
  </script>
</body>
</html
